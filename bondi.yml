rmin_in_au             : 10.0
rmax_in_au             : 5000.0
ncell                  : 2000
gamma                  : 1.1
maxtime_in_yr          : 40.0
number_of_snaps        : 2000
potential              : Potential::POINT_MASS
## Gravitaional potential
# Potential::<OPTION>
# OPTIONs = POINT_MASS, NONE
courant_factor         : 0.05
# Riemann::<OPTION>
# OPTIONs = EXACT, HLLC
riemannsolver_type     : Riemann::HLLC
coord_system           : Coordinate::SPHERICAL_1D
# Coordinate::<OPTION>
# OPTIONs = SPHERICAL_1D, CARTESIAN_1D
hydro_order            : 2
status_update_interval : 10.0
boundary_type          : BoundaryType::OPEN
# BoundaryType::<OPTION>
# OPTIONs = OPEN, BONDI
mass_point_mass_in_msol: 10.0
bondi_density_in_si    : 1.0e-15
unit_mass_in_si        : 1.98840987069805e31
unit_length_in_si      : 2.7091640467030e15
unit_time_in_si        : 2.70916404670302e11
sound_infinity_in_si   : 10000
rho_infinity_in_si     : 1e-15
velocity_infinity_in_si: 1
#
heat_conduction        : HeatConduction::OFF
thermal_conductivity   : 0.0
